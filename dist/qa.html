<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Living Document | viewport QA</title><style>*{box-sizing:border-box}body{margin:0;background:#d9ded4;font:13px Arial;color:#171916}header{height:60px;display:flex;gap:10px;align-items:center;padding:12px 20px}header span{margin-right:12px}button{background:#f4f2ec;border:1px solid #465447;color:#171916;padding:9px 14px;cursor:pointer}.stage{position:relative;margin:10px auto}iframe{border:0;position:absolute;top:0;left:0;transform-origin:top left;background:#f4f2ec}</style><header><span>Viewport QA</span><button data-width="320">320</button><button data-width="360">360</button><button data-width="390">390</button><button data-width="430">430</button><button data-width="768">768</button><button data-width="1440">1440</button></header><div class="stage"><iframe id="site-frame" title="Website at selected viewport" src="./index.html"></iframe></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('.stage');function resize(width){const height=width<768?844:900,scale=Math.min(1,(innerWidth-40)/width,(innerHeight-90)/height);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.width=width*scale+'px';stage.style.height=height*scale+'px';history.replaceState({},'', '?width='+width)}document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>resize(Number(button.dataset.width))));resize(Number(new URLSearchParams(location.search).get('width'))||390);</script>
